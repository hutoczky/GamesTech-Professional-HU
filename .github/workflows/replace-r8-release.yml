name: Replace Professional HUB with R8

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-hub:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      PART1_URL: 'https://sdmntprukwest.oaiusercontent.com/files/00000000-8720-8243-aaef-f7e4f063c798/raw?se=2026-09-27T21%3A42%3A05Z&sp=r&sv=2026-02-06&sr=b&scid=a6c8bee0-e845-5dce-a107-0baca3dff36d&skoid=34268b52-5349-4f34-9be4-e38a5fb9f231&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-27T06%3A21%3A57Z&ske=2026-09-28T06%3A21%3A57Z&sks=b&skv=2026-02-06&sig=MjHYlKLhS7sdrojYkoMMoXaKuQA3rsznO5KzckBsp9U%3D'
      PART2_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-1b10-81f4-aa8c-b52d9c879879/raw?se=2026-09-27T21%3A42%3A15Z&sp=r&sv=2026-02-06&sr=b&scid=ca58cc94-6eb6-54db-a44a-2717839379a6&skoid=34268b52-5349-4f34-9be4-e38a5fb9f231&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-27T06%3A22%3A45Z&ske=2026-09-28T06%3A22%3A45Z&sks=b&skv=2026-02-06&sig=HIELlFzXiXRz6e8Pi3EX3H1H1h%2BT9NLDJYX7tnt4JGU%3D'
      NEW_FILE: GamesTech_HU_PROFESSIONAL_UNIFIED_HUB_V2.0.33_R8_STUDIO_CACHYOS_THUMBS_WINDOWS_LINUX.zip
      OLD_FILE: GamesTech_HU_PROFESSIONAL_UNIFIED_HUB_V2.0.33_R6_WINDOWS_CLICK_AUTODETECT_ELITE_UI_FIX_WINDOWS_LINUX.zip
    steps:
      - name: Download staged R8 parts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release
          curl --fail --location --retry 4 --retry-delay 2 "$PART1_URL" -o .release/r8.part01
          curl --fail --location --retry 4 --retry-delay 2 "$PART2_URL" -o .release/r8.part02
          cat .release/r8.part01 .release/r8.part02 > ".release/$NEW_FILE"

      - name: Verify R8 SHA-256
        shell: bash
        run: |
          set -euo pipefail
          echo "cb9c8775ebf1acab644a06a515bdd3d343952342dee0195300291dc12b3a4c9e  .release/$NEW_FILE" | sha256sum -c -

      - name: Replace release asset
        shell: bash
        run: |
          set -euo pipefail
          gh release delete-asset gamestech-hu-v1.0.0 "$OLD_FILE" -y || true
          gh release upload gamestech-hu-v1.0.0 ".release/$NEW_FILE" --clobber
          gh release edit gamestech-hu-v1.0.0 \
            --title 'GamesTech Professional HU v1.0.0' \
            --notes 'Aktuális kiadás: Professional Unified HUB V2.0.33 R8 (Studio / CachyOS / Thumbnails) és Modpack Installer v1.4.0 Windows/Linux.'
