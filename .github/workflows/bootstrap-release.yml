name: Bootstrap assets and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-ee74-81f4-8366-4d811e0fc611/raw?se=2026-09-27T21%3A01%3A03Z&sp=r&sv=2026-02-06&sr=b&scid=84e21ae7-808b-58d7-b5e9-31eef685a6e4&skoid=34268b52-5349-4f34-9be4-e38a5fb9f231&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-27T06%3A52%3A58Z&ske=2026-09-28T06%3A52%3A58Z&sks=b&skv=2026-02-06&sig=XQZoqi%2BL0YEhx7TFrXv%2B%2BrMbwTBfYVZHMVvPrn/p4GI%3D'
      PART1_URL: 'https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-2388-820a-9c0d-b6bb0cf275b2/raw?se=2026-09-27T21%3A01%3A24Z&sp=r&sv=2026-02-06&sr=b&scid=7647241c-c8f5-534e-a3b0-09bb36f471b8&skoid=34268b52-5349-4f34-9be4-e38a5fb9f231&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-27T13%3A45%3A56Z&ske=2026-09-28T13%3A45%3A56Z&sks=b&skv=2026-02-06&sig=upjwXZEQotThLZqwjEaXLsUOk7vbd6yW0guou7ERnDo%3D'
      PART2_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-b968-81f4-9475-fad3344413b3/raw?se=2026-09-27T21%3A01%3A36Z&sp=r&sv=2026-02-06&sr=b&scid=5506b801-1f68-52d1-9076-b6fc743aa6b3&skoid=34268b52-5349-4f34-9be4-e38a5fb9f231&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-27T07%3A30%3A05Z&ske=2026-09-28T07%3A30%3A05Z&sks=b&skv=2026-02-06&sig=YFZiPhL420etEypGnSU1eNdbgbUKWYacVlkyvsSMjqM%3D'
      MODPACK_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-3a68-8210-a3b5-b0958941a121/raw?se=2026-09-27T21%3A01%3A40Z&sp=r&sv=2026-02-06&sr=b&scid=1b8ec714-1340-51b5-af15-3f53ef747062&skoid=34268b52-5349-4f34-9be4-e38a5fb9f231&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-27T17%3A39%3A49Z&ske=2026-09-28T17%3A39%3A49Z&sks=b&skv=2026-02-06&sig=P5DCft3Zjk0bTliY9HfRitgqyWzq/V0UOGZtKNSmhoM%3D'
      HUB_FILE: GamesTech_HU_PROFESSIONAL_UNIFIED_HUB_V2.0.33_R6_WINDOWS_CLICK_AUTODETECT_ELITE_UI_FIX_WINDOWS_LINUX.zip
      MODPACK_FILE: GamesTech_HU_Modpack_Installer_v1.4.0_STABILITY_FIX_Windows_Linux.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download staged assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets .bootstrap
          curl --fail --location --retry 4 --retry-delay 2 "$IMAGE_URL" -o assets/gamestech-professional-hu.png
          curl --fail --location --retry 4 --retry-delay 2 "$PART1_URL" -o .bootstrap/hub.part01
          curl --fail --location --retry 4 --retry-delay 2 "$PART2_URL" -o .bootstrap/hub.part02
          curl --fail --location --retry 4 --retry-delay 2 "$MODPACK_URL" -o ".bootstrap/$MODPACK_FILE"
          cat .bootstrap/hub.part01 .bootstrap/hub.part02 > ".bootstrap/$HUB_FILE"

      - name: Verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          echo '789c0661aa20cf06ef2ac1313bbd412ff83fbb0f7d858d945b5ca672fcbefffe  assets/gamestech-professional-hu.png' | sha256sum -c -
          echo "2c89acce28ee2879b71811017f2e2811f666daeaaeb125a8d7ecba3bdb16a034  .bootstrap/$HUB_FILE" | sha256sum -c -
          echo "9a30ea005bd2be5725492874c112b37fd471356136f15aebcf2558be4b1ec9ec  .bootstrap/$MODPACK_FILE" | sha256sum -c -

      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view gamestech-hu-v1.0.0 >/dev/null 2>&1; then
            gh release upload gamestech-hu-v1.0.0 ".bootstrap/$HUB_FILE" ".bootstrap/$MODPACK_FILE" --clobber
          else
            gh release create gamestech-hu-v1.0.0 ".bootstrap/$HUB_FILE" ".bootstrap/$MODPACK_FILE" \
              --title 'GamesTech Professional HU v1.0.0' \
              --notes 'Első különálló GamesTech Professional HU kiadás. Tartalmazza a Professional Unified HUB V2.0.33 R6 és a Modpack Installer v1.4.0 Windows/Linux csomagokat.'
          fi

      - name: Commit pixel-reference asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/gamestech-professional-hu.png
          if git diff --cached --quiet; then
            echo 'Image already present.'
          else
            git commit -m 'Add pixel-locked master reference asset'
            git push
          fi