name: Fetch AION2 CN reference

on:
  push:
    branches:
      - aion2-current-source-research

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download public working AION2 CN files
        run: |
          set -euo pipefail
          mkdir -p ref
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/duoluoyuji/Aion2-Steam-CN/main/zh/L10NString.dat' -o ref/L10NString_current.dat
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/duoluoyuji/Aion2-Steam-CN/cd537f1a7b7db2c04ec0162c423c9ab82caaa6d6/zh/L10NString.dat' -o ref/L10NString_2026-09-19.dat
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/duoluoyuji/Aion2-Steam-CN/main/zh/pakchunk502000-Windows_0_P.pak' -o ref/pakchunk502000-Windows_0_P.pak
          sha256sum ref/*
          ls -lh ref/*
          python3 - <<'PY'
          from pathlib import Path
          for p in sorted(Path('ref').glob('L10NString*.dat')):
              b=p.read_bytes()
              print(p.name, len(b), b[:64].hex(' '))
          PY

      - name: Analyze working CN DAT format
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct, json, hashlib

          p=Path('ref/L10NString_current.dat')
          b=p.read_bytes()
          out={
            'size':len(b),
            'sha256':hashlib.sha256(b).hexdigest(),
            'head64_hex':b[:64].hex(' '),
            'tail64_hex':b[-64:].hex(' '),
            'u32_0':struct.unpack_from('<I',b,0)[0] if len(b)>=4 else None,
            'ascii_4_10':b[4:10].decode('ascii','replace') if len(b)>=10 else None,
            'u32_10':struct.unpack_from('<I',b,10)[0] if len(b)>=14 else None,
          }

          key=bytes([0x25,0xA8,0x7E,0x91])
          def xor(raw): return bytes(x ^ key[i%4] for i,x in enumerate(raw))
          def readstr(pos):
              if pos+4>len(b): raise EOFError('len')
              n=struct.unpack_from('<i',b,pos)[0]; pos+=4
              if n==0: return '',pos
              size=n if n>0 else -n*2
              if size<0 or pos+size>len(b): raise ValueError(f'bad size {size} at {pos-4}')
              raw=xor(b[pos:pos+size]); pos+=size
              if n>0:
                  if not raw.endswith(b'\0'): raise ValueError('utf8 nul')
                  return raw[:-1].decode('utf-8'),pos
              else:
                  if not raw.endswith(b'\0\0'): raise ValueError('utf16 nul')
                  return raw[:-2].decode('utf-16-le'),pos

          legacy={'ok':False}
          try:
              pos=14
              sample=[]
              count=0
              while pos<len(b):
                  k,pos=readstr(pos); v,pos=readstr(pos); count+=1
                  if len(sample)<5: sample.append([k,v])
              legacy={'ok':pos==len(b),'records':count,'eof':pos,'samples':sample}
          except Exception as e:
              legacy={'ok':False,'error':repr(e),'pos':locals().get('pos',None)}
          out['legacy_parse']=legacy

          stub=Path('ref/pakchunk502000-Windows_0_P.pak').read_bytes()
          out['stub_size']=len(stub)
          out['stub_hex']=stub.hex(' ')
          out['stub_ascii']=stub.decode('ascii','replace')

          Path('ref/report.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: aion2-cn-reference
          path: ref/
          retention-days: 2

